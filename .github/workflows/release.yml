name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$dest"/

      - name: Run GUT
        run: GODOT=~/godot/godot tools/test.sh

      - name: Export builds
        run: |
          mkdir -p build/linux build/windows
          ~/godot/godot --headless --export-release "Linux" build/linux/margin.x86_64
          ~/godot/godot --headless --export-release "Windows Desktop" build/windows/margin.exe
          test -f build/linux/margin.x86_64
          test -f build/windows/margin.exe

      - name: Package
        run: |
          (cd build/linux && zip -q ../../margin-linux-x86_64.zip margin.x86_64)
          (cd build/windows && zip -q ../../margin-windows-x86_64.zip margin.exe)

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # grab everything under this version's heading up to the next one
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Margin ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            margin-linux-x86_64.zip margin-windows-x86_64.zip
