name: Feature request
description: Suggest an idea for the game
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard to do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: For new parts, orbits or missions, links to the real data behind them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you thought about.
